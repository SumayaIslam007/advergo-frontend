name: Deploy

# Runs after CI finishes on main. Only proceeds if CI succeeded, so a broken
# lint/type-check/build never reaches build-and-push.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Short SHA
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/advergo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/advergo-frontend:sha-${{ steps.vars.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Ensure remote directory exists
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.VPS_SSH_USER }}/advergo/frontend

      # Keeps the server's compose file in sync with the repo on every deploy.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/${{ secrets.VPS_SSH_USER }}/advergo/frontend/"
          strip_components: 0

      - name: Write .env.prod and deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /home/${{ secrets.VPS_SSH_USER }}/advergo/frontend
            cat > /home/${{ secrets.VPS_SSH_USER }}/advergo/frontend/.env.prod <<'ENVEOF'
            ${{ secrets.FRONTEND_ENV_PROD }}
            ENVEOF
            chmod 600 /home/${{ secrets.VPS_SSH_USER }}/advergo/frontend/.env.prod

            cd /home/${{ secrets.VPS_SSH_USER }}/advergo/frontend
            # Explicit -p: the directory is named "frontend", which is
            # generic enough to risk colliding with other projects later.
            docker compose -p advergo-frontend -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -p advergo-frontend -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            for i in $(seq 1 15); do
              if curl -fs http://127.0.0.1:3010/ > /dev/null; then
                echo "Frontend is up."
                exit 0
              fi
              sleep 4
            done
            echo "Frontend failed health check after deploy." >&2
            docker logs --tail 100 advergo-frontend-web-1 || true
            exit 1
