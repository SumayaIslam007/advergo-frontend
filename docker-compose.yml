# Local development. For production, see docker-compose.prod.yml.
# Expects the backend to be reachable at NEXT_PUBLIC_API_URL (set in
# .env.local) -- typically the advergo-backend dev stack running separately.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: npm run dev
    volumes:
      - .:/app
      # Named volumes so the bind mount above doesn't shadow node_modules /
      # the build cache installed into the image.
      - advergo_frontend_node_modules:/app/node_modules
      - advergo_frontend_next:/app/.next
    ports:
      - "3000:3000"
    env_file: .env.local

volumes:
  advergo_frontend_node_modules:
  advergo_frontend_next:
