# Production stack. `web` binds directly to a host port (3000) -- point your
# own reverse proxy / Cloudflare Tunnel / whatever at it.
#
# NEXT_PUBLIC_API_URL is inlined into the client JS bundle at *build* time,
# so it must come from --env-file (Compose variable substitution into
# build.args below), not just env_file (which only affects the running
# container, too late for a value baked into already-built JS):
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "3000:3000"
