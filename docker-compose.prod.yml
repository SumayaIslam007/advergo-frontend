# Production stack. `web` binds to 127.0.0.1 only -- Cloudflare Tunnel
# reaches it over localhost, so it's never exposed on the VPS's public
# interface directly.
#
# The image is pulled pre-built from Docker Hub (built by CI, with
# NEXT_PUBLIC_API_URL already baked in at build time -- see the workflow's
# build step), not built here.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
services:
  web:
    image: ${DOCKERHUB_USERNAME}/advergo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "127.0.0.1:3010:3000"
